<h2 class="mb-6 text-3xl font-bold text-capsula-900">Planetas</h2>

@if (cargando()) {
  <p class="text-stone-500">Cargando…</p>
} @else {
  <p class="mb-4 text-sm text-stone-500">{{ total() }} planetas · página {{ pagina() }} de {{ totalPaginas() }}</p>

  <section class="columns-2 gap-4 sm:columns-3 lg:columns-4">
    @for (p of planetas(); track p.id) {
      <app-planeta-card [planeta]="p" />
    } @empty {
      <p class="text-stone-500">No hay planetas para mostrar.</p>
    }
  </section>

  <app-paginador [pagina]="pagina()" [totalPaginas]="totalPaginas()" (cambio)="pagina.set($event)" />
}
